<div class="min-h-dvh">
  <header class="sticky top-0 z-10 border-b border-line bg-paper/90 backdrop-blur-[14px]">
    <div
      class="mx-auto flex h-13.5 max-w-310 items-center gap-4.5 px-4 sm:h-14.5 sm:gap-12.5 sm:px-7"
    >
      <a
        class="inline-flex items-center gap-2.25 font-bold tracking-[-0.04em] focus-visible:outline-accent"
        [routerLink]="['/', locale()]"
        aria-label="FantoDev home"
      >
        <span
          class="grid size-6.25 place-items-center rounded bg-ink text-lg font-extrabold text-paper"
          >f</span
        >
        <span class="hidden sm:block">fanto.dev</span>
      </a>
      <nav class="flex gap-4 text-[13px] text-muted sm:gap-7.5" aria-label="Main navigation">
        <a
          class="hidden transition-colors hover:text-ink focus-visible:outline-accent sm:inline"
          [routerLink]="['/', locale()]"
          fragment="projects"
          >{{ locale() === 'de' ? 'Projekte' : 'Projects' }}</a
        >
        <a
          class="transition-colors hover:text-ink focus-visible:outline-accent"
          [routerLink]="['/', locale(), 'writing']"
          >Writing</a
        >
      </nav>
      <div class="ml-auto flex items-center gap-2.5 text-xs text-muted sm:gap-4">
        <div class="flex gap-1 font-bold tracking-[0.03em]" aria-label="Language selection">
          <a
            class="text-muted transition-colors hover:text-ink focus-visible:outline-accent"
            [class.text-ink]="locale() === 'en'"
            [routerLink]="languageUrl('en')"
            [attr.aria-current]="locale() === 'en' ? 'page' : null"
            aria-label="Switch to English"
            >EN</a
          ><span class="text-muted" aria-hidden="true">/</span
          ><a
            class="text-muted transition-colors hover:text-ink focus-visible:outline-accent"
            [class.text-ink]="locale() === 'de'"
            [routerLink]="languageUrl('de')"
            [attr.aria-current]="locale() === 'de' ? 'page' : null"
            aria-label="Auf Deutsch wechseln"
            >DE</a
          >
        </div>
        <div
          class="flex items-center gap-px rounded-full border border-line p-0.5"
          aria-label="Color theme"
        >
          <button
            class="grid h-5 w-5.5 cursor-pointer place-items-center rounded-full border-0 p-0 text-xs leading-none transition-colors"
            [class.bg-ink]="theme() === 'light'"
            [class.text-paper]="theme() === 'light'"
            [class.bg-transparent]="theme() !== 'light'"
            [class.text-muted]="theme() !== 'light'"
            type="button"
            (click)="setTheme('light')"
            aria-label="Use light theme"
          >
            ☼
          </button>
          <button
            class="grid h-5 w-5.5 cursor-pointer place-items-center rounded-full border-0 p-0 text-xs leading-none transition-colors"
            [class.bg-ink]="theme() === 'dark'"
            [class.text-paper]="theme() === 'dark'"
            [class.bg-transparent]="theme() !== 'dark'"
            [class.text-muted]="theme() !== 'dark'"
            type="button"
            (click)="setTheme('dark')"
            aria-label="Use dark theme"
          >
            ☾
          </button>
        </div>
        <a
          class="hidden min-w-5 items-center justify-center text-xs font-bold text-muted transition-colors hover:text-ink focus-visible:outline-accent sm:inline-flex"
          href="https://github.com/fantodev0"
          aria-label="GitHub profile"
          target="_blank"
          rel="noreferrer"
          ><app-lucide name="github" [size]="16"
        /></a>
        <a
          class="hidden min-w-5 items-center justify-center text-xs font-bold text-muted transition-colors hover:text-ink focus-visible:outline-accent sm:inline-flex"
          href="https://linkedin.com/in/placeholder"
          aria-label="LinkedIn placeholder"
          target="_blank"
          rel="noreferrer"
          ><app-lucide name="linkedin" [size]="16"
        /></a>
        <a
          class="hidden min-w-5 items-center justify-center text-xs font-bold text-muted transition-colors hover:text-ink focus-visible:outline-accent sm:inline-flex"
          href="mailto:hello@fanto.dev"
          aria-label="Email Lucien"
          ><app-lucide name="mail" [size]="16"
        /></a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-310 px-4 sm:px-7"><router-outlet /></main>
</div>
