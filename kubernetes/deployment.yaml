apiVersion: apps/v1
kind: Deployment
metadata:
  name: webpage
  namespace: webpage
  labels:
    app: webpage
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: webpage
  template:
    metadata:
      labels:
        app: webpage
    spec:
      imagePullSecrets:
        - name: registry-fanto-dev
      containers:
        - name: webpage
          image: registry.fanto.dev/fantodev0/webpage:main-0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet:
              path: /en
              port: http
              httpHeaders:
                - name: Host
                  value: fanto.dev
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /en
              port: http
              httpHeaders:
                - name: Host
                  value: fanto.dev
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /en
              port: http
              httpHeaders:
                - name: Host
                  value: fanto.dev
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
